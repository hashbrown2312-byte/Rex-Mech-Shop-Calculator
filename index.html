<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Crafting Calculator</title>
<style>
:root{color-scheme:dark;--bg:#0d1117;--panel:#151b23;--card:#1c2430;--border:#303b49;--text:#f3f5f7;--muted:#9da9b6;--accent:#8b5cf6}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(135deg,#0b0e13,#121824);font-family:Arial,sans-serif;color:var(--text);min-height:100vh}
main{max-width:1100px;margin:auto;padding:28px 18px}.header h1{margin:0 0 7px;font-size:30px}.header p{margin:0 0 20px;color:var(--muted)}
.grid{display:grid;grid-template-columns:1fr 1.35fr;gap:18px}.panel{background:rgba(21,27,35,.96);border:1px solid var(--border);border-radius:16px;padding:18px}
.search{width:100%;padding:13px;border:1px solid var(--border);border-radius:10px;background:var(--card);color:var(--text);font-size:16px}
.recipes{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:13px;max-height:480px;overflow:auto}.recipe{padding:12px;border:1px solid var(--border);border-radius:10px;background:var(--card);color:var(--text);text-align:left;cursor:pointer}.recipe:hover{border-color:var(--accent)}
h2{font-size:21px;margin:0 0 12px}.addrow{display:flex;gap:10px;align-items:end}.field{flex:1}.field label{display:block;font-size:13px;color:var(--muted);margin-bottom:6px}.field input{width:100%;padding:11px;border:1px solid var(--border);border-radius:9px;background:var(--card);color:var(--text);font-size:16px}
button{border:1px solid var(--border);border-radius:9px;background:var(--card);color:var(--text);padding:11px 15px;cursor:pointer;font-weight:600}button:hover{border-color:var(--accent)}.add{background:var(--accent);border-color:var(--accent)}
.queue{margin-top:18px}.queueitem{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--border)}.remove{padding:6px 9px;font-size:12px}
.summary{margin-top:18px}.summary table{width:100%;border-collapse:collapse}.summary th,.summary td{padding:10px 7px;border-bottom:1px solid var(--border);text-align:left}.summary th:last-child,.summary td:last-child{text-align:right}.muted{color:var(--muted)}.empty{color:var(--muted);padding:10px 0}
.actions{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
@media(max-width:760px){.grid{grid-template-columns:1fr}.recipes{grid-template-columns:1fr}.addrow{flex-wrap:wrap}.field{min-width:130px}}
</style>
</head>
<body>
<main>
<div class="header"><h1>🔧 Crafting Calculator</h1><p>Add multiple items and get one combined material list.</p></div>
<div class="grid">
<section class="panel">
<h2>Recipes</h2>
<input id="search" class="search" placeholder="Search tyre, turbo, brakes..." autocomplete="off">
<div id="recipes" class="recipes"></div>
</section>
<section class="panel">
<h2>Add items to calculation</h2>
<div class="addrow">
<div class="field"><label>Recipe</label><input id="chosen" readonly placeholder="Select a recipe"></div>
<div class="field" style="max-width:120px"><label>Quantity</label><input id="quantity" type="number" min="1" max="9999" value="1"></div>
<button id="add" class="add" type="button">Add</button>
</div>
<div class="queue"><strong>Items being calculated</strong><div id="queue" class="empty">Nothing added yet.</div></div>
<div class="actions"><button id="clear" type="button">Clear all</button></div>
<div class="summary"><h2>Combined materials</h2><div id="result" class="empty">Add one or more items to see the total materials.</div></div>
</section>
</div>
</main>
<script>
const recipes={
"Lighting Controller":{"Plastic":15,"Copper":8,"Glass":15,"Aluminium":15},
"Extras Kit":{"Iron":15,"Glass":10,"Copper":15,"Plastic":4},
"Tyre Smoke":{"Aluminium Powder":8,"Rubber":8,"Aluminium":8},
"Repair Kit":{"Iron":7,"Rubber":7,"Steel":7},
"EV Coolant":{"Aluminium Powder":20,"Iron Powder":20,"Plastic":30},
"AWD":{"Metal Scrap":25,"Rubber":35,"Plastic":15,"Iron":13,"Iron Powder":30,"Steel":35},
"Tyre Replacement":{"Rubber":31,"Steel":6},
"Respray":{"Iron Powder":7,"Aluminium Powder":8},
"Spark Plug":{"Metal Scrap":7,"Glass":33},
"Engine Oil":{"Aluminium Powder":6,"Iron Powder":12,"Plastic":15},
"Turbo":{"Steel":88,"Aluminium Powder":77,"Aluminium":66,"Plastic":45},
"Nitro Bottle":{"Metal Scrap":130,"Steel":150,"Plastic":80,"Glass":130},
"Brakepad Replacement":{"Glass":5,"Steel":2,"Plastic":5},
"Vehicle Wheels Set":{"Aluminium Powder":3,"Rubber":4,"Aluminium":5},
"Nitro Install Kit":{"Metal Scrap":150,"Copper":150,"Steel":250,"Glass":100},
"Clutch Replacement":{"Rubber":15,"Glass":15,"Iron":23,"Copper":5,"Steel":23},
"Bodykit":{"Glass":5,"Steel":2,"Plastic":5},
"Semi Slick":{"Iron":50,"Rubber":200,"Steel":70},
"Air Filter":{"Glass":22,"Plastic":18},
"Performance Part":{"Metal Scrap":5,"Plastic":5,"Steel":5,"Glass":2,"Copper":2},
"Stance Kit":{"Metal Scrap":35,"Iron":15,"Iron Powder":15,"Steel":35},
"Slick":{"Iron":50,"Rubber":200,"Steel":70},
"Suspension Parts":{"Aluminium":24,"Aluminium Powder":33,"Iron Powder":15,"Steel":43},
"Ceramic Brakes":{"Copper":80,"Aluminium Powder":28,"Rubber":100,"Aluminium":150}
};
let selected="",items=[];
const $=id=>document.getElementById(id), list=$("recipes"),search=$("search"),chosen=$("chosen"),qty=$("quantity"),queue=$("queue"),result=$("result");
function renderRecipes(){let q=search.value.toLowerCase().trim();list.innerHTML="";Object.keys(recipes).filter(x=>x.toLowerCase().includes(q)).forEach(x=>{let b=document.createElement("button");b.type="button";b.className="recipe";b.textContent=x;b.onclick=()=>{selected=x;chosen.value=x};list.appendChild(b)})}
function render(){if(!items.length){queue.className="empty";queue.textContent="Nothing added yet.";result.className="empty";result.textContent="Add one or more items to see the total materials.";return}
queue.className="";queue.innerHTML=items.map((x,i)=>`<div class="queueitem"><span><strong>${x.name}</strong> × ${x.qty}</span><button class="remove" data-i="${i}" type="button">Remove</button></div>`).join("");
queue.querySelectorAll(".remove").forEach(b=>b.onclick=()=>{items.splice(Number(b.dataset.i),1);render()});
let totals={};items.forEach(x=>Object.entries(recipes[x.name]).forEach(([m,v])=>totals[m]=(totals[m]||0)+v*x.qty));
let rows=Object.entries(totals).map(([m,v])=>`<tr><td>${m}</td><td><strong>${v.toLocaleString()}</strong></td></tr>`).join("");
result.className="";result.innerHTML=`<table><thead><tr><th>Material</th><th>Total Required</th></tr></thead><tbody>${rows}</tbody></table>`;
}
$("add").onclick=()=>{if(!selected)return;let n=Math.max(1,Math.min(9999,Math.floor(Number(qty.value)||1)));let existing=items.find(x=>x.name===selected);if(existing)existing.qty+=n;else items.push({name:selected,qty:n});render()};
$("clear").onclick=()=>{items=[];render()};search.oninput=renderRecipes;renderRecipes();
</script>
</body>
</html>
